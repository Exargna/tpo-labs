name: Security Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install zap-cli

      - name: Run Bandit (SAST)
        run: bandit -r . --severity-level high

      - name: Run Flask app in background
        run: |
          python app.py &
          sleep 5

      - name: Run ZAP (DAST)
        run: |
          docker run -d -p 8080:8080 ghcr.io/zaproxy/zaproxy:stable zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true
          sleep 20
          zap-cli --api-url http://localhost:8080 status -t 60
          zap-cli --api-url http://localhost:8080 open-url http://localhost:5000/api/users
          zap-cli --api-url http://localhost:8080 spider http://localhost:5000
          zap-cli --api-url http://localhost:8080 active-scan http://localhost:5000
          zap-cli --api-url http://localhost:8080 report -o zap_report.html -f html

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html