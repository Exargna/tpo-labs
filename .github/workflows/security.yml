name: Security Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bandit (SAST)
        run: bandit -r . --severity-level high

      - name: Run Flask app in background
        run: |
          python app.py &
          sleep 5

      - name: Run ZAP Scan (DAST)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:5000/api/users'
          fail_action: false
          artifact_name: zap-report